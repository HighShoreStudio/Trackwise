<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- niente zoom con il pizzico o il doppio tap: l'app gestisce da sola le dimensioni -->
  <!-- resizes-visual: su Android la tastiera si sovrappone senza ridimensionare l'app -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteCantiere">
  <meta name="theme-color" content="#F2F3F5">
  <title>NoteCantiere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* su iOS impedisce che la pagina scorra quando si apre la tastiera */
      inset: 0;
      background: #F2F3F5;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* altezza reale visibile su iOS/Android, barre del browser escluse */
      display: block;
      outline: none;
      touch-action: none;
      background: #F2F3F5;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #15181E;
      background: #F2F3F5;
      transition: opacity .25s ease;
    }
    #loader h1 { margin: 0; font-size: 22px; font-weight: 700; }
    #loader .track { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: #E1E4E9; overflow: hidden; }
    #loader .bar { width: 0; height: 100%; border-radius: 3px; background: #F5B700; transition: width .15s linear; }
    #loader .error { display: none; max-width: 80vw; text-align: center; font-size: 15px; color: #D42A2A; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>NoteCantiere</h1>
    <div class="track"><div class="bar" id="loader-bar"></div></div>
    <div class="error" id="loader-error"></div>
  </div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var bar = document.getElementById("loader-bar");
    var errorBox = document.getElementById("loader-error");

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/f67a29f7c8b2026ec9b08e508d793dd0.data.unityweb",
      frameworkUrl: buildUrl + "/4d01f04b47dfb301af7cecf86a78b91b.framework.js.unityweb",
      codeUrl: buildUrl + "/c3a84adc15672868b09616e2c75cd38b.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "The Crazy Picture",
      productName: "NoteCantiere",
      productVersion: "0.2.0",
      // risoluzione piena dello schermo (testi nitidi), limitata a 3x per non pesare sui telefoni
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
      // niente banner di avviso di Unity sopra l'app
      showBanner: function (msg, type) { if (type === "error") console.error(msg); else console.warn(msg); },
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/1e18800491373c089e14318045f0f991.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        bar.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance; // utile per il debug dalla console del browser
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 300);
      }).catch(function (message) {
        errorBox.textContent = "Impossibile avviare l'app: " + message;
        errorBox.style.display = "block";
      });
    };
    document.body.appendChild(script);

    // ?debug nell'indirizzo: pannello con lo stato della tastiera, leggibile anche sul telefono
    if (/[?&]debug/.test(location.search)) {
      var dbg = document.createElement("div");
      dbg.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:99999;pointer-events:none;" +
        "font:11px/1.35 monospace;color:#fff;background:rgba(0,0,0,.72);padding:6px 8px;border-radius:6px;white-space:pre";
      document.body.appendChild(dbg);
      setInterval(function () {
        var vv = window.visualViewport, k = window.__NCK, a = document.activeElement;
        dbg.textContent =
          "ponte tastiera: " + (k ? "attivo" : "NON attivo") +
          (k ? "  focus: " + (k.focused ? "si" : "no") : "") + "\n" +
          "innerHeight: " + window.innerHeight + "  scrollY: " + window.scrollY + "\n" +
          (vv ? "visual: h " + Math.round(vv.height) + "  offsetTop " + Math.round(vv.offsetTop) + "\n" : "") +
          "canvas: " + canvas.style.height + " " + (canvas.style.transform || "-") + "\n" +
          "attivo: " + (a ? a.tagName : "-") + "  input nel DOM: " + document.querySelectorAll("input,textarea").length;
      }, 250);
    }
  </script>
</body>
</html>
