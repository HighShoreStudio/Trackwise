<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- niente zoom con il pizzico o il doppio tap: l'app gestisce da sola le dimensioni -->
  <!-- resizes-visual: su Android la tastiera si sovrappone senza ridimensionare l'app -->
  <!-- viewport-fit=cover: lo sfondo dell'app arriva sotto la barra di stato e ai lati del notch;
       l'interfaccia resta nell'area sicura (letta da env(safe-area-inset-*) in NoteCantiereWeb.jslib) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trackwise">
  <!-- colore aggiornato dall'app secondo il tema (WebPage.cs) -->
  <meta name="theme-color" content="#FFFFFF">
  <title>Trackwise</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* colori del caricamento: quelli del tema "Dinamico" (predefinito), chiaro o scuro come il sistema */
    :root { --page: #F1F5F8; --text: #1D3350; --track: #DCE4EB; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #0E1525; --text: #E6EBF3; --track: #2A3953; }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* su iOS impedisce che la pagina scorra quando si apre la tastiera */
      inset: 0;
      background: var(--page);
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* altezza reale visibile su iOS/Android, barre del browser escluse */
      display: block;
      outline: none;
      touch-action: none;
      background: var(--page);
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--page);
      transition: opacity .25s ease;
    }
    #loader h1 { margin: 0; font-size: 22px; font-weight: 700; }
    #loader img { width: 96px; height: 96px; }
    #loader .track { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
    #loader .bar { width: 0; height: 100%; border-radius: 3px; background: #1AD1B3; transition: width .15s linear; }
    #loader .error { display: none; max-width: 80vw; text-align: center; font-size: 15px; color: #D42A2A; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="icon-192.png" alt="">
    <h1>Trackwise</h1>
    <div class="track"><div class="bar" id="loader-bar"></div></div>
    <div class="error" id="loader-error"></div>
  </div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var bar = document.getElementById("loader-bar");
    var errorBox = document.getElementById("loader-error");

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/ed362518311ad4ebc26a1204ae3ca243.data.unityweb",
      frameworkUrl: buildUrl + "/52a42f2eb4099b5f82b5614613c6c2f9.framework.js.unityweb",
      codeUrl: buildUrl + "/f9cb199dc4049baf42de461174c47b3f.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "The Crazy Picture",
      productName: "Trackwise",
      productVersion: "1.2.3",
      // risoluzione piena dello schermo (testi nitidi), limitata a 3x per non pesare sui telefoni
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
      // niente banner di avviso di Unity sopra l'app
      showBanner: function (msg, type) { if (type === "error") console.error(msg); else console.warn(msg); },
      // "Script error." senza dettagli arriva da script esterni alla pagina (es. Safari quando si apre
      // il menu Condividi): non riguarda l'app, quindi niente avviso bloccante. Gli altri errori restano.
      errorHandler: function (err, url, line) {
        var message = (err && err.message) || String(err || "");
        if (/^Script error\.?$/.test(message.trim()) || (!url && !line && /Script error/.test(message))) {
          console.warn("Errore esterno ignorato:", message);
          return true;
        }
        return false;
      },
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/0f3cfe227e331bebeb28d8c03d393573.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        bar.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance; // utile per il debug dalla console del browser
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 300);
      }).catch(function (message) {
        errorBox.textContent = "Impossibile avviare l'app: " + message;
        errorBox.style.display = "block";
      });
    };
    document.body.appendChild(script);

  </script>
</body>
</html>
