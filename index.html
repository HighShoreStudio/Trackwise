<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- niente zoom con il pizzico o il doppio tap: l'app gestisce da sola le dimensioni -->
  <!-- resizes-visual: su Android la tastiera si sovrappone senza ridimensionare l'app -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteCantiere">
  <meta name="theme-color" content="#F2F3F5">
  <title>NoteCantiere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* su iOS impedisce che la pagina scorra quando si apre la tastiera */
      inset: 0;
      background: #F2F3F5;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* altezza reale visibile su iOS/Android, barre del browser escluse */
      display: block;
      outline: none;
      touch-action: none;
      background: #F2F3F5;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #15181E;
      background: #F2F3F5;
      transition: opacity .25s ease;
    }
    #loader h1 { margin: 0; font-size: 22px; font-weight: 700; }
    #loader .track { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: #E1E4E9; overflow: hidden; }
    #loader .bar { width: 0; height: 100%; border-radius: 3px; background: #F5B700; transition: width .15s linear; }
    #loader .error { display: none; max-width: 80vw; text-align: center; font-size: 15px; color: #D42A2A; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>NoteCantiere</h1>
    <div class="track"><div class="bar" id="loader-bar"></div></div>
    <div class="error" id="loader-error"></div>
  </div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var bar = document.getElementById("loader-bar");
    var errorBox = document.getElementById("loader-error");

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/7295fd3ae3252a8953c8b149224002d1.data.unityweb",
      frameworkUrl: buildUrl + "/d306e4d6cd5db340ac596ab688678b71.framework.js.unityweb",
      codeUrl: buildUrl + "/9ba987f2116cbbd657f68bd014721df3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "The Crazy Picture",
      productName: "NoteCantiere",
      productVersion: "0.1.1",
      // risoluzione piena dello schermo (testi nitidi), limitata a 3x per non pesare sui telefoni
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
      // niente banner di avviso di Unity sopra l'app
      showBanner: function (msg, type) { if (type === "error") console.error(msg); else console.warn(msg); },
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/fa6514de44222037e320fefee31d2ff6.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        bar.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance; // utile per il debug dalla console del browser
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 300);
      }).catch(function (message) {
        errorBox.textContent = "Impossibile avviare l'app: " + message;
        errorBox.style.display = "block";
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
